[package]
name = "near-kit-macros"
description = "Proc macros for near-kit typed contract interfaces"
keywords = ["near", "blockchain", "macro", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"
version = "0.15.0-rc.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The compile tests need near-kit from this workspace (a path dev-dependency,
# stripped on publish), so they can't run from the package.
exclude = ["tests"]

[lib]
proc-macro = true

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate = "3"

[dev-dependencies]
trybuild = "1.0"
near-kit = { path = "../near-kit", features = ["contracts"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
