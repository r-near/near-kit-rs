[package]
name = "near-kit"
description = "A clean, ergonomic Rust client for NEAR Protocol"
keywords = ["near", "blockchain", "crypto", "web3"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
readme = "../../README.md"
version = "0.18.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# NEAR ecosystem types
near-account-id.workspace = true
near-token.workspace = true
near-gas.workspace = true
near-global-contracts.workspace = true

# Async runtime — only pull in `sync` here; `time` is added below for every
# target except JS-host wasm.
tokio = { version = "1", features = ["sync"] }

# HTTP client: target-specific — see the two feature-gated target tables below
# (reqwest everywhere except WASI, via `rpc`; `wasi:http` bindings on
# wasm32-wasip2, via `wasi-http`).

# Serialization
serde.workspace = true
serde_json.workspace = true
borsh.workspace = true
base64.workspace = true

# Cryptography
ed25519-dalek.workspace = true
sha2.workspace = true
sha3.workspace = true
ml-dsa.workspace = true
getrandom.workspace = true
bip39 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
k256.workspace = true

# Encoding
bs58.workspace = true
hex.workspace = true

# Filesystem (optional; gated by `file-signer` — no filesystem on JS-host wasm)
dirs = { workspace = true, optional = true }

# System keyring (optional)
keyring = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true

# Logging (optional; gated by `tracing` — see src/trace.rs for the no-op fallback)
tracing = { workspace = true, optional = true }

# Proc macros for typed contracts (opt-in via the `contracts` feature)
near-kit-macros = { workspace = true, optional = true }

serde_with = { version = "3.20", features = ["hex", "base64"] }

# Native targets: tokio timer support for the RPC retry backoff. Wasm targets
# sleep differently — the JS host's timers on `wasm32-unknown-unknown` (below),
# `std::thread::sleep` on single-threaded WASI guests (see client/rpc.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "time"] }

# HTTP transport, part 1 — every target except WASI (native + JS-host wasm,
# which uses reqwest's fetch backend). Optional; pulled in by the `rpc` feature.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "wasi")))'.dependencies]
reqwest = { workspace = true, optional = true }

# HTTP transport, part 2 — wasm32-wasip2 only: raw `wasi:http/outgoing-handler`
# bindings for the built-in blocking transport. reqwest has no WASI support (its
# native stack needs an aws-lc-sys C cross-compile and hyper's tokio `net`,
# neither of which builds for wasm). Optional; pulled in by the `wasi-http`
# feature. Scoped to `target_env = "p2"`: earlier WASI targets (wasm32-wasip1)
# predate the component model and have no `wasi:http` interface at all.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
wasi = { version = "0.14", optional = true }

# JS-host wasm only (`wasm32-unknown-unknown`, i.e. browsers/Node/Deno — NOT
# WASI): JS-backed timer and time APIs. `getrandom` is the entropy backend for
# key generation and NEP-413 nonces; its `wasm_js` feature is opt-in via the
# crate's `js` feature (see below) so non-JS wasm embedders can choose their own
# backend instead.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"

[features]
default = ["rpc"]
# The JSON-RPC layer: the `Near` client, query/transaction builders, contract
# and token helpers, and the HTTP transport underneath them. Pulls in reqwest
# everywhere except WASI (`dep:` on a target-inactive optional dependency is a
# no-op there). On WASI the built-in transport comes from `wasi-http` instead;
# `rpc` alone means bring-your-own via `NearBuilder::transport`. Disable (via
# `default-features = false`) for offline use — types, signing, and transaction
# building without a network stack.
rpc = ["dep:reqwest"]
# Typed contract interfaces and the `#[near_kit::contract]` proc macro.
contracts = ["rpc", "dep:near-kit-macros"]
# The built-in `wasi:http` transport for `wasm32-wasip2` (implies `rpc`; a
# no-op on every other target). Kept separate from `rpc` because merely
# compiling the built-in transport makes the component import `wasi:http`,
# which hosts without that interface refuse to instantiate — leave this off
# and inject a custom transport to run on such hosts.
wasi-http = ["rpc", "dep:wasi"]
keyring = ["dep:keyring"]
file-signer = ["dep:dirs"]
# Emit `tracing` spans and events for RPC calls, transactions, and token
# operations. Disable (via `default-features = false`) to drop the dependency.
tracing = ["dep:tracing"]
# BIP-39 seed phrases and SLIP-10 hierarchical key derivation.
mnemonic = ["dep:bip39", "dep:hmac"]
# JS-host entropy backend for `wasm32-unknown-unknown`. Enables `getrandom`'s
# `wasm_js` feature. Leave this off on non-JS wasm embedders (register your own
# `getrandom` backend) and on WASI targets (which `getrandom` supports natively).
js = ["getrandom/wasm_js"]

# These examples drive a live `Near` client end to end. Quickstart also
# demonstrates the opt-in typed-contract macros. Docker-backed examples live
# in the `near-kit-sandbox` package.
[[example]]
name = "quickstart"
required-features = ["contracts"]

[[example]]
name = "meta_transactions"
required-features = ["rpc"]

[dev-dependencies]
futures.workspace = true
# The tracing integration tests need the real `tracing` crate regardless of
# how the optional main dependency is configured.
tracing.workspace = true
tracing-subscriber.workspace = true

# All targets except JS-host wasm: full tokio runtime for tests and doctests
# (unified with the minimal `sync`/`time` features from the dependency above).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Native targets only: libsecp256k1 at the version nearcore's `near-crypto`
# uses, to check secp256k1 signatures exactly as the node does
# (tests/secp256k1_nearcore_compat.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
secp256k1 = { version = "0.27", default-features = false, features = ["std", "recovery"] }
