[package]
name = "near-kit"
description = "A clean, ergonomic Rust client for NEAR Protocol"
keywords = ["near", "blockchain", "crypto", "web3"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
readme = "../../README.md"
version = "0.13.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# NEAR ecosystem types
near-account-id.workspace = true
near-token.workspace = true
near-gas.workspace = true
near-global-contracts.workspace = true

# Async runtime — only pull in `sync` here; `time` is added below for every
# target except JS-host wasm, and `rt` is added by the `sandbox` feature.
tokio = { version = "1", features = ["sync"] }
futures.workspace = true

# HTTP client: target-specific — see the two `rpc`-gated target tables below
# (reqwest everywhere except WASI; `wasi:http` bindings on WASI).

# Serialization
serde.workspace = true
serde_json.workspace = true
borsh.workspace = true
base64.workspace = true

# Cryptography
ed25519-dalek.workspace = true
sha2.workspace = true
sha3.workspace = true
ml-dsa.workspace = true
rand.workspace = true
bip39.workspace = true
hmac.workspace = true
k256.workspace = true

# Encoding
bs58.workspace = true
hex.workspace = true

# Filesystem (optional; gated by `file-signer` — no filesystem on JS-host wasm)
dirs = { workspace = true, optional = true }

# System keyring (optional)
keyring = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true

# Logging (optional; gated by `tracing` — see src/trace.rs for the no-op fallback)
tracing = { workspace = true, optional = true }

# Proc macros for typed contracts
near-kit-macros.workspace = true

# Optional: Sandbox integration (via Docker/testcontainers)
testcontainers = { workspace = true, optional = true, features = ["watchdog"] }
libc = { version = "0.2", optional = true }
serde_with = { version = "3.20", features = ["hex", "base64"] }

# Native targets: tokio timer support for the RPC retry backoff. Wasm targets
# sleep differently — the JS host's timers on `wasm32-unknown-unknown` (below),
# `std::thread::sleep` on single-threaded WASI guests (see client/rpc.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "time"] }

# HTTP transport, part 1 — every target except WASI (native + JS-host wasm,
# which uses reqwest's fetch backend). Optional; pulled in by the `rpc` feature.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "wasi")))'.dependencies]
reqwest = { workspace = true, optional = true }

# HTTP transport, part 2 — WASI only: raw `wasi:http/outgoing-handler` bindings
# for the built-in blocking transport. reqwest has no WASI support (its native
# stack needs an aws-lc-sys C cross-compile and hyper's tokio `net`, neither of
# which builds for wasm). Optional; pulled in by the `rpc` feature.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasi = { version = "0.14", optional = true }

# JS-host wasm only (`wasm32-unknown-unknown`, i.e. browsers/Node/Deno — NOT
# WASI): JS-backed timer and time APIs. `getrandom`/`getrandom_v04` are entropy
# backends for the transitive `rand`/`ml-dsa` dependency graphs; their
# `js`/`wasm_js` features are opt-in via the crate's `js` feature (see below) so
# non-JS wasm embedders can choose their own backend instead.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
getrandom = { version = "0.2", default-features = false }
getrandom_v04 = { package = "getrandom", version = "0.4", default-features = false }

[features]
default = ["rpc", "keyring", "file-signer", "tracing"]
# The JSON-RPC layer: the `Near` client, query/transaction builders, contract
# and token helpers, and the HTTP transport underneath them. Pulls in the HTTP
# client appropriate to the target: reqwest off-WASI, `wasi:http` on WASI
# (`dep:` on a target-inactive optional dependency is a no-op, so only the
# matching one compiles). Disable (via `default-features = false`) for offline
# use — types, signing, and transaction building without a network stack.
rpc = ["dep:reqwest", "dep:wasi"]
sandbox = ["rpc", "dep:testcontainers", "dep:libc", "tokio/rt"]
keyring = ["dep:keyring"]
file-signer = ["dep:dirs"]
# Emit `tracing` spans and events for RPC calls, transactions, and token
# operations. Disable (via `default-features = false`) to drop the dependency.
tracing = ["dep:tracing"]
# JS-host entropy backend for `wasm32-unknown-unknown`. Enables `getrandom`'s
# `js` feature (used transitively by `rand`/`ed25519-dalek`/`k256`) and
# `getrandom` 0.4's `wasm_js` feature (used transitively by
# `ml-dsa`/`sha2`/`hmac` via `digest`). Leave this off on non-JS wasm embedders
# (register your own `getrandom` backend) and on WASI targets (which `getrandom`
# supports natively).
js = ["getrandom/js", "getrandom_v04/wasm_js"]
# Enables `interactive-clap` derives on re-exported `NearToken` and `Gas` types.
# Useful for CLI tools using `interactive-clap` for argument parsing.
interactive-clap = ["near-token/interactive-clap", "near-gas/interactive-clap"]

# These two examples drive a live `Near` client end to end, so they only build
# with the RPC layer. The remaining examples compile without `rpc`: their
# client usage sits behind `#[cfg(feature = "sandbox")]` with stub fallbacks.
[[example]]
name = "quickstart"
required-features = ["rpc"]

[[example]]
name = "meta_transactions"
required-features = ["rpc"]

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
# The tracing integration tests need the real `tracing` crate regardless of
# how the optional main dependency is configured.
tracing.workspace = true
tracing-subscriber.workspace = true

# All targets except JS-host wasm: full tokio runtime for tests and doctests
# (unified with the minimal `sync`/`time` features from the dependency above).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
