[package]
name = "near-kit-sandbox"
description = "Docker-backed local sandbox support for near-kit"
keywords = ["near", "blockchain", "testing", "sandbox"]
categories = ["development-tools::testing", "api-bindings"]
readme = "README.md"
version = "0.21.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `integration-tests` only builds the Docker-backed test suite.
[package.metadata.docs.rs]
features = ["tracing"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libc = "0.2"
near-kit = { workspace = true, features = ["rpc"] }
serde_json.workspace = true
testcontainers = { workspace = true, features = ["watchdog"] }
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
tracing = { workspace = true, optional = true }

[features]
# Compile the Docker-backed integration suite. Kept opt-in so ordinary
# workspace tests never start a sandbox container.
integration-tests = ["near-kit/contracts"]
# Preserve near-kit's tracing spans and the sandbox tracing integration suite.
tracing = ["dep:tracing", "near-kit/tracing"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration-tests"]

# Each example starts its own sandbox in Docker, so they need the
# `integration-tests` feature (which also turns on near-kit's `contracts`).
[[example]]
name = "global_contracts"
required-features = ["integration-tests"]

[[example]]
name = "relayer"
required-features = ["integration-tests"]

[[example]]
name = "rotating_signer"
required-features = ["integration-tests"]

[[example]]
name = "sequential_sends"
required-features = ["integration-tests"]

[[example]]
name = "tokens"
required-features = ["integration-tests"]

[[example]]
name = "typed_contract"
required-features = ["integration-tests"]

[dev-dependencies]
futures.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
