[workspace]
# Enable changelog updates
changelog_update = true

# Create git tags for releases
git_tag_enable = true

# Create GitHub releases
git_release_enable = true

# Mark GitHub releases of pre-release versions (e.g. 0.20.0-rc.1) as pre-releases
git_release_type = "auto"

# Labels for the release PR
pr_labels = ["release"]

# Run cargo-semver-checks to detect breaking changes
semver_check = true

# near-kit-sandbox exposes near-kit types (e.g. `Near`), so a near-kit release
# that bumps its version must bump the sandbox to match. Otherwise a sandbox
# patch release could depend on a newer near-kit than callers pin, and they'd
# compile two incompatible near-kit versions.
[[package]]
name = "near-kit"
version_group = "near-kit"

[[package]]
name = "near-kit-sandbox"
version_group = "near-kit"

# near-kit re-exports near-kit-primitives' types at its own paths (e.g.
# `near_kit::protocol::Action` is `near_kit_primitives::protocol::Action`), so
# the two must release in lockstep: a primitives release that bumps its version
# without near-kit following would leave callers compiling two incompatible
# copies of the same types. Keep them in one version group until primitives
# reaches 1.0.
[[package]]
name = "near-kit-primitives"
version_group = "near-kit"
