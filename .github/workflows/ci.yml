name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: false
          cache-on-failure: "true"
      - run: cargo fmt --all -- --check
      # The published default is intentionally just `rpc`.
      - run: cargo clippy -p near-kit --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      # Covers the sandbox crate without its optional tracing instrumentation.
      - run: cargo clippy -p near-kit-sandbox --all-targets --no-default-features --features integration-tests
      # `contracts` is independently opt-in and implies `rpc`.
      - run: cargo check -p near-kit --all-targets --no-default-features --features contracts
      # Covers the offline (no `rpc`) configuration, including tests/examples gating
      - run: cargo check -p near-kit --all-targets --no-default-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          cache-all-crates: "true"
          workspaces: ". -> target"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run all-feature tests with coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Run default-feature library tests
        run: cargo test -p near-kit --lib
      - name: Run default-feature doctests
        run: cargo test -p near-kit --doc
      - name: Run all-feature doctests
        run: cargo test -p near-kit --all-features --doc
      # The offline (no `rpc`) configuration keeps its own doctests compiling;
      # examples that need the RPC layer are cfg_attr'd to `ignore` without it
      - name: Run offline doctests
        run: cargo test -p near-kit --no-default-features --doc
      - name: Run contract macro compile tests
        run: cargo test -p near-kit-macros --test trybuild
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - run: cargo check -p near-kit --all-targets
      - run: cargo check --workspace --all-targets --all-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      # Browser: the full client over reqwest's JS `fetch` backend
      - run: cargo check --target wasm32-unknown-unknown -p near-kit --no-default-features --features js,rpc
      # Browser: typed-contract macro expansion on top of the RPC client
      - run: cargo check --target wasm32-unknown-unknown -p near-kit --no-default-features --features js,contracts
      # WASI: the offline core (types, signing, tx building) without a transport
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features
      # WASI with the RPC layer but no built-in transport (hosts without
      # wasi:http; the caller injects one via NearBuilder::transport)
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features rpc
      # WASI with typed-contract support and an injected transport
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features contracts
      # WASI with the built-in wasi:http transport
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features wasi-http
