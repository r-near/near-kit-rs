name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: false
          cache-on-failure: "true"
      - run: cargo fmt --all -- --check
      # The published default is intentionally just `rpc`.
      - run: cargo clippy -p near-kit --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      # Covers the sandbox crate without its optional tracing instrumentation.
      - run: cargo clippy -p near-kit-sandbox --all-targets --features integration-tests
      # `contracts` is independently opt-in and works offline (no `rpc`):
      # the macro then generates only the `FunctionCall` constructors.
      - run: cargo check -p near-kit --all-targets --no-default-features --features contracts
      - run: cargo check -p near-kit --all-targets --no-default-features --features rpc,contracts
      # Covers the offline (no `rpc`) configuration, including tests/examples gating
      - run: cargo check -p near-kit --all-targets --no-default-features
      # Mnemonic derivation is independently opt-in and works without networking.
      - run: cargo check -p near-kit --all-targets --no-default-features --features mnemonic
      # near-kit-primitives on its own, with no optional features.
      - run: cargo clippy -p near-kit-primitives --all-targets --no-default-features
      # near-kit-primitives must stay client-free: no async runtime or HTTP
      # stack in its normal dependency graph, on any target. Fails if one appears.
      - name: near-kit-primitives has no tokio/reqwest/hyper
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree -p near-kit-primitives --all-features -e normal --target all --prefix none)
          if grep -E '^(tokio|reqwest|hyper) ' <<<"$tree"; then
            echo "::error::near-kit-primitives depends on tokio, reqwest or hyper (see above)"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          cache-all-crates: "true"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run all-feature tests with coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Run default-feature library tests
        run: cargo test -p near-kit --lib
      - name: Run default-feature doctests
        run: cargo test -p near-kit --doc
      # The sandbox doctests are compile-only (`no_run`): they need Docker to
      # run, not to build.
      - name: Run all-feature doctests
        run: cargo test --workspace --all-features --doc
      # The offline (no `rpc`) configuration keeps its own doctests compiling;
      # examples that need the RPC layer are cfg_attr'd to `ignore` without it
      - name: Run offline doctests
        run: cargo test -p near-kit --no-default-features --doc
      - name: Run offline mnemonic tests
        run: cargo test -p near-kit --no-default-features --features mnemonic --lib
      - name: Run near-kit-primitives tests, with #[contract] through it alone
        run: cargo test -p near-kit-primitives --no-default-features --features contracts
      - name: Run offline (no rpc) contract macro compile tests
        run: cargo test -p near-kit --no-default-features --features contracts --test contracts_offline
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  # `#[contract]` against near-sdk's own `#[ext_contract]` encoding. A
  # separate workspace and job: near-sdk's `unit-testing` feature builds
  # nearcore crates the main workspace doesn't need.
  near-sdk-wire:
    name: near-sdk wire format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/near-kit-macros/tests/near-sdk-wire
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/near-kit-macros/tests/near-sdk-wire
          shared-key: near-sdk-wire
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - run: cargo fmt -- --check
      # Not `--locked`: a release bumps near-kit's version, which this lock
      # file records.
      - run: cargo test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: false
          cache-on-failure: "true"
      # What a default-feature build documents (broken intra-doc links to
      # feature-gated items show up here).
      - run: cargo doc --workspace --no-deps
      # The feature sets docs.rs builds; keep in step with each crate's
      # [package.metadata.docs.rs]. (`--cfg docsrs` needs nightly, so it is
      # left out here.)
      - run: cargo doc -p near-kit --no-deps --features contracts,file-signer,keyring,mnemonic,tracing
      - run: cargo doc -p near-kit-primitives --no-deps --features contracts,mnemonic,tracing
      - run: cargo doc -p near-kit-sandbox --no-deps --features tracing

  public-api:
    name: Public API
    runs-on: ubuntu-latest
    env:
      # The snapshot builds on a pinned nightly; a new nightly lint must not
      # fail the API check.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      # The nightly and cargo-public-api versions are pinned in the script.
      - name: Read pinned versions
        id: pins
        run: scripts/public-api.sh --pins >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.nightly }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-public-api@${{ steps.pins.outputs.cargo-public-api }}
      # On failure the diff is in the log and the job summary; update with
      # `scripts/public-api.sh --bless` and commit public-api/.
      - run: scripts/public-api.sh

  # Advisory only: reports what semver bump the PR implies relative to the
  # latest crates.io release. Expected to flag breaks during pre-1.0 refactors,
  # so it never fails the job; release-plz enforces the real check.
  semver:
    name: Semver (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - uses: taiki-e/install-action@cargo-semver-checks
      - name: cargo semver-checks
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo semver-checks -p near-kit -p near-kit-primitives -p near-kit-sandbox --color never 2>&1 | tee semver.txt
      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.check.outcome }}" = success ]; then
            echo "## Semver: no breaking changes against the latest release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Semver (advisory)::cargo semver-checks reported problems; see the job summary"
            {
              echo "## Semver: problems against the latest release (advisory)"
              echo
              echo '```'
              head -n 500 semver.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - run: cargo check --workspace --all-targets --all-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      # Browser: the full client over reqwest's JS `fetch` backend
      - run: cargo check --target wasm32-unknown-unknown -p near-kit --no-default-features --features js,rpc
      # Browser: typed-contract macro expansion on top of the RPC client
      - run: cargo check --target wasm32-unknown-unknown -p near-kit --no-default-features --features js,rpc,contracts
      # Browser: offline mnemonic generation and derivation with JS entropy
      - run: cargo check --target wasm32-unknown-unknown -p near-kit --no-default-features --features js,mnemonic
      # WASI: the offline core (types, signing, tx building) without a transport
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features
      # WASI: opt-in mnemonic generation and derivation with native WASI entropy
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features mnemonic
      # WASI with the RPC layer but no built-in transport (hosts without
      # wasi:http; the caller injects one via NearBuilder::transport)
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features rpc
      # WASI: offline typed-contract bindings (FunctionCall constructors, no RPC)
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features contracts
      # WASI with typed-contract support and an injected transport
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features rpc,contracts
      # WASI with the built-in wasi:http transport
      - run: cargo check --target wasm32-wasip2 -p near-kit --no-default-features --features wasi-http
      # near-kit-primitives alone (what wasm contracts depend on). The near-kit
      # checks above already build it with the same features on WASI, and with
      # `js,mnemonic`; near-kit's `js,rpc` pulls in more of the graph than
      # `js` alone.
      - run: cargo check --target wasm32-unknown-unknown -p near-kit-primitives --no-default-features --features js
      # `#[contract]` expanded for wasm: the macro's test target, where the
      # library checks never invoke it (near-kit's `contracts` doesn't forward
      # to near-kit-primitives')
      - run: cargo check --target wasm32-wasip2 -p near-kit-primitives --no-default-features --features contracts --test contract_macro
      - run: cargo check --target wasm32-unknown-unknown -p near-kit-primitives --no-default-features --features js,contracts --test contract_macro

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: false
          cache-on-failure: "true"
      # Lint and Test build every example; `quickstart` reads from testnet, so
      # it isn't run here.
      # No network: offline signing builds with no features at all.
      - run: cargo run -p near-kit --example offline_signing --no-default-features
      - run: cargo run -p near-kit --example mock_backend --features contracts
      # Each of these starts its own sandbox in Docker and stops it on exit.
      - name: Run sandbox examples
        shell: bash
        run: |
          set -euo pipefail
          for example in typed_contract tokens relayer rotating_signer sequential_sends global_contracts; do
            echo "::group::$example"
            cargo run -p near-kit-sandbox --example "$example" --features integration-tests
            echo "::endgroup::"
          done
