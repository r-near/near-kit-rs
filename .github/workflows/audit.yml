name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit@0.22.2
      # RUSTSEC-2026-0440: astral-tokio-tar is unmaintained, with no fixed
      # release. It comes in only through testcontainers, which only
      # near-kit-sandbox uses; near-kit and near-kit-primitives don't depend
      # on it. testcontainers uses tar only to copy files into or out of a
      # container and to build images, and near-kit-sandbox does none of
      # these: it runs a prebuilt sandbox image. Drop the ignore once testcontainers moves off the crate.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2026-0440
