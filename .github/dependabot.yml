version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Security updates run as soon as an alert is available, independently
      # of the weekly version-update schedule.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Batch semver-compatible version updates into a single weekly PR.
      patch-and-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # The secp256k1 dev-dependency mirrors the version nearcore's near-crypto
      # uses, so the compat test checks signatures exactly as the node does.
      # Bump it only when near-crypto does.
      - dependency-name: "secp256k1"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The MSRV CI job pins this action to the MSRV version on purpose;
      # bumping it would silently turn the MSRV check into a stable check.
      - dependency-name: "dtolnay/rust-toolchain"
