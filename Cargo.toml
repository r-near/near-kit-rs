[workspace]
resolver = "3"
members = [
    "crates/near-kit",
    "crates/near-kit-macros",
]

# Shared workspace metadata
[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/r-near/near-kit-rs"
rust-version = "1.88"

# Shared dependencies - crates can use `workspace = true` to inherit these
[workspace.dependencies]
# NEAR ecosystem types
near-account-id = { version = "2.6", features = ["serde", "borsh"] }
near-token = { version = "0.3", features = ["serde", "borsh"] }
near-gas = { version = "0.3", features = ["serde", "borsh"] }
near-global-contracts = { version = "0.2", features = ["serde", "borsh"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Serialization
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
base64 = "0.23"

# Cryptography
# These versions are chosen together so the crypto graph agrees on one
# `rand_core` (0.10) and therefore one `getrandom` (0.4): `k256` 0.14 brings
# `elliptic-curve` 0.14 / `ecdsa` 0.17 / `signature` 3, which is what
# `ed25519-dalek` 3 and `ml-dsa` 0.1 already sit on. Bumping any of these back
# splits `rand_core` again — see `SecretKey::generate_ed25519`.
ed25519-dalek = { version = "3", features = ["rand_core"] }
sha2 = "0.11"
sha3 = "0.12"
ml-dsa = "0.1"
rand = "0.10"
bip39 = "2"
hmac = "0.13"
k256 = { version = "0.14", features = ["ecdsa"] }

# Encoding
bs58 = "0.5"
hex = "0.4"

# Filesystem
dirs = "6"

# System keyring (optional)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Proc macro dependencies
syn = { version = "3", features = ["full", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Optional: Sandbox integration (via Docker/testcontainers)
testcontainers = "0.28"

# Dev dependencies
tokio-test = "0.4"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
near-kit = { path = "crates/near-kit", version = "0.16.0" }
near-kit-macros = { path = "crates/near-kit-macros", version = "0.12.1" }

[profile.release]
lto = true
codegen-units = 1
